description: "Dockerized, self-hosted browser automation platform built on Playwright that lets you visually build and run browser tasks using modular action blocks. Workflows can be executed through the web interface, REST API, MCP integration, or dedicated n8n node—making it ideal for automation, web scraping, internal tools, and AI-powered browser agents."
